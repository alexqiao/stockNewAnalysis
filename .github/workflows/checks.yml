name: Checks

on: [push, pull_request]

permissions:
  contents: read

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      CI_REQUIRE_BROWSER: '1'
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install locked dependencies
        run: |
          python -m pip install uv==0.11.1
          uv sync --frozen --extra dev --extra social
      - name: Install browser for interaction tests
        run: uv run --no-sync playwright install --with-deps chrome
      - name: Lint
        run: uv run --no-sync ruff check .
      - name: Type check
        run: uv run --no-sync mypy src
      - name: Offline tests
        run: uv run --no-sync pytest -m 'not network' --junitxml=test-results/junit.xml
      - name: Upload failure diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: test-failure-diagnostics
          path: test-results/
          retention-days: 7
      - name: Check whitespace and tracked artifacts
        run: |
          git show --format= --check HEAD
          git diff --exit-code
